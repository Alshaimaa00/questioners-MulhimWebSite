const nf = v => S.lang === "ar" ? String(v).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]) : String(v);
const tlx = o => (S.lang === "ar" ? o.ar : o.en);
const tipA = o => o ? ` data-tip="${esc(tlx(o))}" tabindex="0"` : "";

let _vid = 0;
const polar = (cx, cy, r, deg) => [cx + r*Math.cos(deg*Math.PI/180), cy + r*Math.sin(deg*Math.PI/180)];
const arcPath = (cx, cy, r, a0, a1) => {
  const [x0, y0] = polar(cx, cy, r, a0), [x1, y1] = polar(cx, cy, r, a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${(a1 - a0) > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
};
const band = v => v >= 80 ? {en:"Excellent", ar:"ممتاز", c:"ok"} : v >= 65 ? {en:"Good", ar:"جيد", c:"ok"} : {en:"Fair", ar:"مقبول", c:"warn"};

function vizHTML(sp){
  const ar = S.lang === "ar", pc = ar ? "٪" : "%";
  const id = "v" + (++_vid);

  /* ---- range meters: your value on a track, with the target range shaded ---- */
  if (sp.k === "bars"){
    const plain = sp.rows.some(r => r.txt || r.risk);
    return `<div class="rms ${plain ? "plain" : ""}">` + sp.rows.map((r, i) => {
      const cls = r.risk ? "risk" : (r.warn || (!plain && r.v < 50)) ? "warn" : "";
      return `<div class="rm ${cls}" style="--v:${r.v}; --k:${i}"${tipA(r.tip)}>
        <div class="rm-h"><span>${tlx(r)}</span><b>${r.txt || nf(r.v) + pc}</b></div>
        <div class="rm-t">${plain ? "" : '<i class="rm-opt"></i>'}<i class="rm-f"></i>${plain ? "" : '<i class="rm-k"></i>'}</div>
      </div>`;}).join("") + (plain ? "" : `<div class="rm-lg"><i></i>${ar ? "النطاق المستهدف" : "Target range"}</div>`) + `</div>`;
  }

  /* ---- 270° score dial with tick marks and a travelling knob ---- */
  if (sp.k === "ring"){
    const A0 = 135, SW = 270, ticks = [];
    for (let i = 0; i <= 36; i++){
      const a = A0 + SW*i/36, [x0, y0] = polar(100, 100, 84, a), [x1, y1] = polar(100, 100, i % 6 ? 88 : 91, a);
      ticks.push(`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`);
    }
    const d = arcPath(100, 100, 68, A0, A0 + SW), [kx, ky] = polar(100, 100, 68, A0), bd = band(sp.v);
    return `<div class="dial"${tipA(sp.tip)}>
      <svg viewBox="0 0 200 178" aria-hidden="true">
        <defs><linearGradient id="${id}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#5FD0C0"/><stop offset="1" stop-color="var(--brand)"/></linearGradient></defs>
        <g class="ticks">${ticks.join("")}</g>
        <path class="d-track" d="${d}"/>
        <path class="d-arc" d="${d}" pathLength="100" stroke="url(#${id})" style="--off:${100 - sp.v}"/>
        <g class="knob" style="--rot:${(SW*sp.v/100).toFixed(1)}deg"><circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="8.5"/></g>
        <text class="d-num" x="100" y="106">${nf(sp.v)}<tspan class="d-pc" dx="2">${pc}</tspan></text>
        <text class="d-lab" x="100" y="128">${tlx(sp.lab)}</text>
      </svg>
      <span class="pill-b ${bd.c}">${tlx(bd)}</span>
    </div>`;
  }

  /* ---- zone gauge with a needle ---- */
  if (sp.k === "gauge"){
    const zones = [[0, 40, "z1"], [40, 70, "z2"], [70, 100, "z3"]];
    const paths = zones.map(([a, b, c]) => `<path class="g-${c}" d="${arcPath(100, 100, 78, 180 + 1.8*a + 1.5, 180 + 1.8*b - 1.5)}"/>`).join("");
    const bd = band(sp.v);
    return `<div class="gauge"${tipA(sp.tip)}>
      <svg viewBox="0 0 200 140" aria-hidden="true">
        ${paths}
        <g class="needle" style="--rot:${(-90 + 1.8*sp.v).toFixed(1)}deg"><path d="M96 100 L100 36 L104 100 Z"/></g>
        <circle class="hub" cx="100" cy="100" r="8"/>
        <text class="g-end" x="22" y="118">0</text><text class="g-end" x="178" y="118">100</text>
        <text class="d-num g" x="100" y="136">${nf(sp.v)}<tspan class="d-pc" dx="2">${pc}</tspan></text>
      </svg>
      <div class="g-cap"><span>${tlx(sp.lab)}</span><span class="pill-b ${bd.c}">${tlx(bd)}</span></div>
    </div>`;
  }

  /* ---- smooth curve with gridlines, soft area and a called-out peak ---- */
  if (sp.k === "line"){
    const n = sp.pts.length, X0 = 16, W = 268, Y0 = 112, K = .88;
    const P = sp.pts.map((v, i) => [X0 + i*W/(n - 1), Y0 - v*K]);
    let d = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
    for (let i = 0; i < n - 1; i++){
      const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(n - 1, i + 2)];
      const c1 = [p1[0] + (p2[0] - p0[0])/6, p1[1] + (p2[1] - p0[1])/6], c2 = [p2[0] - (p3[0] - p1[0])/6, p2[1] - (p3[1] - p1[1])/6];
      d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    const xl = tlx(sp.xl), hi = sp.pts.indexOf(Math.max(...sp.pts)), [hx, hy] = P[hi];
    const bx = Math.min(Math.max(hx - 22, 2), 256), txt = nf(sp.pts[hi]) + pc;
    return `<svg viewBox="0 0 300 130" class="lc" aria-hidden="false">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".30"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
        ${[25, 50, 75].map(g => `<line class="gl" x1="${X0}" x2="${X0 + W}" y1="${(Y0 - g*K).toFixed(1)}" y2="${(Y0 - g*K).toFixed(1)}"/>`).join("")}
        <line class="base" x1="${X0}" x2="${X0 + W}" y1="${Y0}" y2="${Y0}"/>
        <path class="l-area" d="${d} L${P[n-1][0].toFixed(1)} ${Y0} L${P[0][0].toFixed(1)} ${Y0} Z" fill="url(#${id})"/>
        <line class="l-drop" x1="${hx.toFixed(1)}" x2="${hx.toFixed(1)}" y1="${(hy + 6).toFixed(1)}" y2="${Y0}"/>
        <path class="l-ln" d="${d}" pathLength="100"/>
        <g class="l-bub"><rect x="${bx.toFixed(1)}" y="${(hy - 30).toFixed(1)}" width="44" height="20" rx="10"/><text x="${(bx + 22).toFixed(1)}" y="${(hy - 16).toFixed(1)}">${txt}</text></g>
        ${P.map((p, i) => `<circle class="l-pt ${i === hi ? "peak" : ""}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === hi ? 5.5 : 4}" tabindex="0"
            data-tip="${esc(xl[i] + " — " + tlx(sp.vl) + ": " + nf(sp.pts[i]) + pc)}"/>`).join("")}
      </svg>
      <div class="xl">${xl.map(x => `<span>${x}</span>`).join("")}</div>`;
  }

  /* ---- composition donut, or stepped zone columns ---- */
  if (sp.k === "segs"){
    const zoned = sp.segs.every(g => g.w === sp.segs[0].w);
    if (zoned) return `<div class="zones">${sp.segs.map((g, i) =>
        `<div class="zc" style="--h:${28 + i*18}%; --o:${g.o || 1}; --k:${i}"${tipA(g.tip)}><i></i><span>${tlx(g)}</span></div>`).join("")}</div>`;
    let acc = 0;
    const segs = sp.segs.map((g, i) => {
      const len = Math.max(g.w - 1.6, .5), off = -acc; acc += g.w;
      return `<circle class="dn-s" cx="60" cy="60" r="42" pathLength="100" transform="rotate(-90 60 60)" style="--len:${len}; --off:${off}; opacity:${g.o || 1}"${tipA(g.tip)}/>`;
    }).join("");
    return `<div class="donut"><svg viewBox="0 0 120 120" aria-hidden="false"><circle class="dn-t" cx="60" cy="60" r="42"/>${segs}
        <text class="d-num dn" x="60" y="68">${nf(sp.segs[0].w)}<tspan class="d-pc" dx="1">${pc}</tspan></text></svg>
      <ul class="dn-lg">${sp.segs.map((g, i) => `<li style="opacity:${g.o || 1}"${tipA(g.tip)}><i></i>${tlx(g)}</li>`).join("")}</ul></div>`;
  }

  /* ---- tolerance rows ---- */
  if (sp.k === "chips") return `<div class="tols">${sp.chips.map((c, i) => {
      const [nm, st] = tlx(c).split(" · ");
      return `<div class="tol ${c.warn ? "warn" : ""}" style="--k:${i}"${tipA(c.tip)}>
        <span class="tol-i">${c.warn ? "!" : CHECK_SVG}</span><b>${nm}</b><span>${st || ""}</span></div>`;}).join("")}</div>`;

  /* ---- squad readiness dots ---- */
  if (sp.k === "grid"){
    const ok = sp.cells.filter(v => v >= 70).length;
    return `<div class="hstat"><b>${nf(ok)}</b><span>${ar ? "من " + nf(sp.cells.length) + " لاعبًا جاهزون" : "of " + sp.cells.length + " players ready"}</span></div>
      <div class="hgrid">${sp.cells.map((v, i) =>
      `<span class="cell ${v >= 70 ? "" : v >= 55 ? "mid" : "low"}" style="--k:${i}" tabindex="0"
        data-tip="${esc((ar ? "اللاعب " : "Player ") + nf(i + 1) + " — " + (ar ? "الجاهزية: " : "Readiness: ") + nf(v) + pc)}"></span>`).join("")}</div>
      <div class="lg"><span>${ar ? "جاهز" : "Ready"}</span><span class="m">${ar ? "راقب" : "Watch"}</span><span class="r">${ar ? "راحة" : "Rest"}</span></div>`;
  }
  return "";
}

  let cur = -1, auto = !matchMedia("(prefers-reduced-motion: reduce)").matches, timer = 0, seen = false;
  const activate = i => {
    if (i === cur) return; cur = i;
    items.forEach((r, k) => r.classList.toggle("on", k === i));
    cards.forEach((c, k) => { const on = k === i; c.classList.toggle("on", on); c.classList.remove("play"); if (on){ void c.offsetWidth; c.classList.add("play"); } });
  };
  const start = () => { clearInterval(timer); if (!auto || !seen) return;
    timer = setInterval(() => { if (!el.isConnected || S.steps[S.i]?.type !== "package"){ clearInterval(timer); return; } activate((cur + 1) % cards.length); }, 5000); };
  const stop = () => { auto = false; clearInterval(timer); };
  items.forEach((r, i) => { ["mouseenter","focus","click"].forEach(ev => r.addEventListener(ev, () => { stop(); activate(i); })); });
  cards.forEach(c => c.addEventListener("click", stop));
  el.querySelector(".of-cards").addEventListener("mouseenter", () => clearInterval(timer));
  el.querySelector(".of-cards").addEventListener("mouseleave", start);
  const say = (t, on) => { const card = t.closest(".pk-vis"); if (!card) return; const ro = card.querySelector(".ro"); ro.textContent = on ? t.dataset.tip : ro.dataset.def; ro.classList.toggle("live", on); };
  el.querySelectorAll("[data-tip]").forEach(t => {
    ["mouseenter","focus","click"].forEach(ev => t.addEventListener(ev, () => say(t, true)));
    ["mouseleave","blur"].forEach(ev => t.addEventListener(ev, () => say(t, false)));
  });
  activate(0);
  const reveal = () => { ofEl.classList.add("in"); seen = true; start(); };
  if ("IntersectionObserver" in window){ const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)){ reveal(); io.disconnect(); } }, {threshold:.25}); io.observe(ofEl); } else reveal();
  setBars({hidePrev:true, hideNext:true});
}

/* a faint DNA helix for the report stage's background */
function helixSVG(){
  let o = '<svg class="pk-dna" viewBox="0 0 120 560" preserveAspectRatio="xMidYMid slice">';
  const X1 = y => 60 + 38*Math.sin(y/46), X2 = y => 60 - 38*Math.sin(y/46);
  let d1 = "", d2 = "";
  for (let y = 0; y <= 560; y += 8){ d1 += (y ? "L" : "M") + X1(y).toFixed(1) + " " + y; d2 += (y ? "L" : "M") + X2(y).toFixed(1) + " " + y; }
  for (let y = 10, i = 0; y < 560; y += 22, i++) o += `<line class="rung" style="animation-delay:${(i*.18).toFixed(2)}s" x1="${X1(y).toFixed(1)}" y1="${y}" x2="${X2(y).toFixed(1)}" y2="${y}"/>`;
  return o + `<path d="${d1}"/><path d="${d2}"/></svg>`;
}

    <div class="gl"><i>${GOAL}</i><b>${pt(PKG_TEXT.goal)}</b><p>${pt(p.goal)}</p></div>
    <div class="by"><b>${ent ? pt(PKG_TEXT.inquire) : pt(PKG_TEXT.buyLine)}</b>
      <span>${ent ? pt(PKG_TEXT.entLine) : pt(PKG_TEXT.buyNext)}</span>${price ? `<em>${pt(price)}</em>` : ""}
      <button type="button" class="cta" data-buy>${ent ? pt(PKG_TEXT.inquire) : pt(PKG_TEXT.buy)}<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
  </div>`;
}
function buyStrip(p, end){
  const price = CONFIG.PRICES && CONFIG.PRICES[p.id];
  const ent = !!p.enterprise;
  return `<div class="pkd-buy ${end ? "end" : ""}">
    <div class="bt"><b>${ent ? pt(PKG_TEXT.inquire) : pt(PKG_TEXT.buyLine)}</b>
      <span>${ent ? pt(PKG_TEXT.entLine) : pt(PKG_TEXT.buyNext)}</span>${price ? `<em>${pt(price)}</em>` : ""}</div>
    <button type="button" class="cta" data-buy>${ent ? pt(PKG_TEXT.inquire) : pt(PKG_TEXT.buy)}<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>`;
}
function buy(p){
  if (p.enterprise){
    /* a short side-path: package page -> register form -> thank-you page */
    S.steps = [{type:"packages"},{type:"package"},{type:"entform"},{type:"entdone"}];
    S.i = 2; render(); window.scrollTo({top:0, behavior:"instant"});
    return;
  }
  const url = CONFIG.CHECKOUT_URLS && CONFIG.CHECKOUT_URLS[p.id];
  if (url){ save(); location.href = url; return; }
  if (S.steps.length !== HEAD().length) S.steps = HEAD();
  S.i = 2; save(); render();      /* demo: no payment page configured */
}

function drawEncourage(el, st){
  const L = S.lang === "ar";
  const info = encourageInfo(st) || {n:1, done:15, total:90, remaining:75};
  const pct  = Math.round(info.done / info.total * 100);
  const stage = pct < 35 ? "early" : pct < 70 ? "middle" : "late";
  const pool  = ENCOURAGE[stage];
  /* position of this page among the pages that fall in the same stage, so a
     message is not repeated within a stage */
  const stageOf = k => { const p = k * CONFIG.ENCOURAGE_EVERY / info.total * 100;
                         return p < 35 ? "early" : p < 70 ? "middle" : "late"; };
  let pos = 0; for (let k = 1; k < info.n; k++) if (stageOf(k) === stage) pos++;
  const m = pool[pos % pool.length];
  const [title, text] = L ? m.ar : m.en;
  const fmt = n => L ? String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]) : n;
  const stat = L ? `أنجزت <b>${fmt(pct)}٪</b> من الاستبيان`
                 : `You're <b>${pct}%</b> of the way there`;
  el.innerHTML = `
    <div class="encourage">
      <div class="ring" style="--p:${pct}"><span>${fmt(pct)}${L ? "٪" : "%"}</span></div>
      <h1>${title}</h1>
      <p>${text}</p>
      <p class="stat">${stat}</p>
    </div>`;
  setBars({nextLabel:L ? "كمّل" : "Keep going", showExit:true, showSave:true});
}

/* ---------- screen: about you (fills the Customer sheet) -----------------
   Every box is checked before the visitor can move on. The rules live in
   LIMITS near the top of this script; the wording lives in T.
   -------------------------------------------------------------------------- */

/* --- the checks themselves. Each returns "" when happy, or a T key. ------ */
const CHECK = {
  name(v){
    if (!v) return "fillfields";
    if (v.length < LIMITS.name.min || v.length > LIMITS.name.max) return "badName";
    /* letters of any alphabet, plus space . ' - */
    return /^[\p{L}\p{M}][\p{L}\p{M}\s.'’-]*$/u.test(v) ? "" : "badName";
  },
  email(v){
    if (!v) return "fillfields";
    if (v.length > LIMITS.email.max) return "badEmail";
    return /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(v) ? "" : "badEmail";
  },
  phone(v){                       /* v is digits only by this point */
    if (!v) return "";            /* phone is optional */
    return (v.length >= LIMITS.phone.minDigits &&
            v.length <= LIMITS.phone.maxDigits) ? "" : "badPhone";
  },
  nid(v){
    if (!v) return "";            /* optional */
    if (v.length < LIMITS.nid.min || v.length > LIMITS.nid.max) return "badNid";
    return /^[A-Za-z0-9-]+$/.test(v) ? "" : "badNid";
  },
  birth(v){
    if (!v) return "fillfields";
    const d = new Date(v);
    if (isNaN(d)) return "badDate";
    if (d > new Date()) return "badDate";
    if (d < new Date("1900-01-01")) return "badDate";
    return "";
  }
};

const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;")
                                .replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function drawIntake(el){
  const L = S.lang === "ar";
  const c = S.customer;

  const sel = (name, list, val) => `<select id="f-${name}">
      <option value="">${L ? "اختر…" : "Select…"}</option>
      ${list.map(o => `<option value="${esc(o.v)}"${val===o.v?" selected":""}>${tx(o)}</option>`).join("")}
    </select>`;

  /* the box that opens under a drop-down when "Other" is picked */
  const otherBox = (name, val, shown) => `<input class="otherbox ${shown?"":"hidden"}"
      id="f-${name}-other" maxlength="${LIMITS.other.max}"
      placeholder="${t("otherLabel")}" value="${esc(val)}">`;

  const dialSel = `<select id="f-dial" aria-label="${L?"رمز الدولة":"Country code"}">

    </select>`;

    <h1 class="sec-title">${L ? "نبذة عنك" : "About you"}</h1>
    <p class="hint">${L
      ? "نستخدم هذه المعلومات لتحديد الأسئلة المناسبة لك."
      : "We use this to decide which questions to show you."}</p>

    <div class="grid2">
      <div class="field" data-f="name"><label>${L?"الاسم":"Full name"} <span class="req">*</span></label>
        <input id="f-name" value="${esc(c.name)}" autocomplete="name"
               maxlength="${LIMITS.name.max}">${err}</div>

      <div class="field" data-f="email"><label>${L?"البريد الإلكتروني":"Email"} <span class="req">*</span></label>
        <input id="f-email" type="email" value="${esc(c.email)}" autocomplete="email"
               maxlength="${LIMITS.email.max}" inputmode="email"
               placeholder="name@example.com" dir="ltr">${err}</div>

      <div class="field" data-f="phone"><label>${L?"رقم التواصل":"Phone"}</label>
        <div class="phonerow" dir="ltr">
          ${dialSel}
          <input id="f-phone" type="tel" inputmode="numeric" autocomplete="tel-national"
                 maxlength="${LIMITS.phone.maxDigits}" dir="ltr"
                 value="${esc(c.phoneNat)}" placeholder="5xxxxxxxx">
        </div>${err}</div>

      <div class="field" data-f="birth"><label>${L?"تاريخ الميلاد":"Date of birth"} <span class="req">*</span></label>
        <input id="f-birth" type="date" value="${esc(c.birth)}"
               min="1900-01-01" max="${new Date().toISOString().slice(0,10)}">${err}</div>

      <div class="field" data-f="gender"><label>${L?"الجنس":"Gender"} <span class="req">*</span></label>
        ${sel("gender", INTAKE_OPTIONS.gender, c.gender)}${err}</div>

      <div class="field" data-f="athlete"><label>${L?"هل أنت رياضي محترف أو تنافسي؟":"Are you a professional or competitive athlete?"} <span class="req">*</span></label>
        ${sel("athlete", INTAKE_OPTIONS.athlete, c.athlete)}${err}</div>

      <div class="field" data-f="ethnicity"><label>${L?"العرق":"Ethnicity"}</label>
        ${sel("ethnicity", INTAKE_OPTIONS.ethnicity, c.ethnicity)}
        ${otherBox("ethnicity", c.ethnicityOther, c.ethnicity === "Other")}${err}</div>

      <div class="field" data-f="country"><label>${L?"الدولة":"Country"}</label>

/* show or hide the "Other" box under a drop-down */
function toggleOther(name){
  const box = $("#f-" + name + "-other");
  if (!box) return;
  const on = $("#f-" + name).value === "Other";
  box.classList.toggle("hidden", !on);
  if (on) box.focus();
}

function readIntake(){
  const g  = id => ($("#f-"+id)?.value || "").trim();
  const bad = {};                      /* field name -> message key */

  const phoneNat = ($("#f-phone")?.value || "").replace(/\D/g, "");
  const dial     = $("#f-dial")?.value || DEFAULT_DIAL;
  const dialIso  = $("#f-dial")?.selectedOptions?.[0]?.dataset.iso || "";

  const c = {
    name:  g("name"),
    email: g("email"),
    birth: g("birth"),
    gender:g("gender"),
    ethnicity:g("ethnicity"),
    country:  g("country"),
    nid:   g("nid"),
    athlete:g("athlete"),
    ethnicityOther:g("ethnicity-other"),
    countryOther:  g("country-other"),
    phoneCode: dial,
    phoneIso:  dialIso,
    phoneNat:  phoneNat,
    /* One Phone column in the Customer sheet, so the code and the number are
       stored together exactly as they would be dialled. */
    phone: phoneNat ? dial + " " + phoneNat : ""
  };

  /* the five that must be filled in at all */
  ["gender","athlete"].forEach(k => { if (!c[k]) bad[k] = "fillfields"; });
  /* the ones with a shape to check */
  [["name",c.name],["email",c.email],["birth",c.birth],
   ["phone",phoneNat],["nid",c.nid]].forEach(([k,v]) => {
     const msg = CHECK[k](v);
     if (msg) bad[k] = msg;
   });
  /* "Other" needs an explanation */
  if (c.country   === "Other" && !c.countryOther)   bad.country   = "badOther";
  if (c.ethnicity === "Other" && !c.ethnicityOther) bad.ethnicity = "badOther";

  document.querySelectorAll(".field").forEach(f => {
    const key = f.dataset.f, msg = bad[key];
    f.classList.toggle("bad", !!msg);
    const e = f.querySelector(".err");
    if (e) e.textContent = msg ? t(msg) : "";
  });

  const keys = Object.keys(bad);
  if (keys.length){
    toast(keys.every(k => bad[k] === "fillfields") ? t("fillfields") : t("fixfields"));
    document.querySelector(".field.bad input,.field.bad select")?.focus();
    return null;
  }

  /* a typed "Other" replaces the word "Other" in the saved row, so the
     Customer sheet carries the real answer rather than a placeholder */
  if (c.country   === "Other" && c.countryOther)   c.country   = c.countryOther;
  if (c.ethnicity === "Other" && c.ethnicityOther) c.ethnicity = c.ethnicityOther;

  /* age in whole years */
  const b = new Date(c.birth), n = new Date();
  let age = n.getFullYear() - b.getFullYear();
  const m = n.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && n.getDate() < b.getDate())) age--;
  c.age = age;
  return c;
}

/* ---------- screen: a question ------------------------------------------- */
function drawQuestion(el, st){
  const q   = Q_BY_ID[st.qid];
  const sec = DB.sections.find(s => s.id === st.sec);
  const at  = DB.answerTypes[q.at];
  const a   = (S.answers[q.id] ||= {choices:[], free:{}, value:""});
  const L   = S.lang === "ar";

  const insText = (L ? q.hintAr : q.hintEn) || (L ? at.insAr : at.insEn);
  const head = `<div class="sec-title">${tx(sec)}</div>
    <h1 class="q">${tx(q)}</h1>
    <p class="hint">${insText}</p>`;

  /* date, number and open-text questions */
  if (at.input === "date" || at.input === "number" || at.input === "text"){
    const lim = NUMBER_LIMITS[q.id] || {};
    let attrs = "", note = "";

    if (at.input === "number"){
      const min = lim.min ?? 0, max = lim.max ?? 1000000;
      attrs = `inputmode="decimal" step="any" min="${min}" max="${max}"`;
      const unit = L ? lim.unitAr : lim.unitEn;
      if (lim.min != null)
        note = `<p class="hint">${min}–${max}${unit ? " " + unit : ""}</p>`;
    } else if (at.input === "date"){
      /* nothing in a health history happens tomorrow */
      attrs = `min="1900-01-01" max="${new Date().toISOString().slice(0,10)}"`;
    } else {
      attrs = `maxlength="${LIMITS.freetext.max}" placeholder="${L ? "اكتب إجابتك ..." : "Type your answer…"}"`;
    }

    el.innerHTML = head + `
      <input class="bigfield" id="val" type="${at.input}" ${attrs}
             value="${esc(a.value)}">
      ${note}
      <p class="err" id="val-err" style="display:none;color:#B4453F;font-size:.85rem"></p>`;

    $("#val").oninput = e => {
      a.value = e.target.value;
      showValueError(q, a.value);
      save();
    };
  } else {
    /* radio or checkbox list */
    const multi = at.multi;
    const opts  = (CHOICES_BY_Q[q.id] || []).map(c => {
      const on = a.choices.includes(c.id);
      return `<label class="opt" data-cid="${c.id}" data-on="${on?1:0}">
        <input type="${multi?"checkbox":"radio"}" name="${q.id}" ${on?"checked":""}>
        <span class="mark ${multi?"square":"round"}"><i></i></span>
        <span class="txt">${tx(c)}${(L ? c.subAr : c.subEn) ? `<span class="sub">${L ? c.subAr : c.subEn}</span>` : ""}
          ${c.free ? `<input class="freetext ${on?"":"hidden"}" data-free="${c.id}"
              maxlength="${LIMITS.other.max}"
              placeholder="${t("specify")}" value="${esc(a.free[c.id])}">` : ""}
        </span><span class="pri">${t("primary")}</span></label>`;
    }).join("");
    el.innerHTML = head + `<fieldset class="opts">${opts}</fieldset>` +
      (q.selcount ? `<p class="selcount" id="selcount"></p>` : "");
    refreshOpts(el, a, q);

    el.querySelectorAll(".opt").forEach(lab => {
      lab.addEventListener("click", ev => {
        if (ev.target.classList.contains("freetext")) return;  /* typing, not choosing */
        ev.preventDefault();
        const cid = lab.dataset.cid;
        if (multi){
          const has = a.choices.includes(cid);
          const cap = q.max || at.max;
          if (!has && cap && a.choices.length >= cap){
            toast(t("maxsel").replace("{n}", cap)); return;
          }
          if (has)                   a.choices = a.choices.filter(x => x !== cid);
          else if (isExcl(cid))      a.choices = [cid];   /* "None" clears the rest */
          else                       a.choices = a.choices.filter(x => !isExcl(x)).concat(cid);
        } else {
          a.choices = a.choices.includes(cid) ? [] : [cid];
        }
        refreshOpts(el, a, q);
        save();
        /* picking an "Other"-style option should put the cursor in its box */
        if (a.choices.includes(cid) && hasFreeText(cid))
          lab.querySelector(".freetext")?.focus();
        /* single-choice questions move on by themselves after a beat */
        if (!multi && a.choices.length && !hasFreeText(cid) && !isLastQuestion(st))
          setTimeout(() => { if (S.steps[S.i] === st) go(1); }, 220);
      });
    });
    el.querySelectorAll(".freetext").forEach(inp => {
      inp.addEventListener("input", e => { a.free[e.target.dataset.free] = e.target.value; save(); });
    });
  }

  const last = isLastQuestion(st);
  setBars({nextLabel: last ? t("finish") : t("next"), showExit:true, showSave:true});
}

function isExcl(cid){
  return DB.choices.some(c => c.id === cid && c.excl);
}
function hasFreeText(cid){
  return DB.choices.some(c => c.id === cid && c.free);
}

/* Is the typed value on a number or date question acceptable?
   Returns "" when fine, or a ready-to-show message. */
function valueError(q, v){
  if (!v) return "";                     /* empty is handled by "required" */
  const at = DB.answerTypes[q.at];
  if (at.input === "number"){
    const lim = NUMBER_LIMITS[q.id] || {};
    const min = lim.min ?? 0, max = lim.max ?? 1000000;
    const n = Number(v);
    if (!isFinite(n) || n < min || n > max)
      return t("numRange").replace("{min}", min).replace("{max}", max);
  }
  if (at.input === "date"){
    const d = new Date(v);
    if (isNaN(d) || d > new Date() || d < new Date("1900-01-01")) return t("badDate");
  }
  return "";
}
function showValueError(q, v){
  const box = $("#val-err");
  if (!box) return "";
  const msg = valueError(q, v);
  box.textContent = msg;
  box.style.display = msg ? "block" : "none";
  $("#val")?.style.setProperty("border-color", msg ? "#B4453F" : "");
  return msg;
}
function refreshOpts(el, a, q){
  el.querySelectorAll(".opt").forEach(lab => {
    const on = a.choices.includes(lab.dataset.cid);
    lab.dataset.on = on ? 1 : 0;
    /* the first pick of a "choose up to N" goal question is the primary one */
    lab.dataset.pri = (q && q.primary && on && a.choices[0] === lab.dataset.cid) ? 1 : 0;
    const inp = lab.querySelector("input[type=radio],input[type=checkbox]");
    if (inp) inp.checked = on;
    const ft = lab.querySelector(".freetext");
    if (ft) ft.classList.toggle("hidden", !on);
  });
  const sc = el.querySelector("#selcount");
  if (sc && q){
    const cap = q.max || DB.answerTypes[q.at].max;
    sc.textContent = a.choices.length + " " + t("of") + " " + cap;
  }
}
function isLastQuestion(st){
  for (let k = S.i + 1; k < S.steps.length; k++){
    const s = S.steps[k];
    if (s.type === "done") return true;
    if (stepVisible(s)) return false;
  }
  return true;
}

/* =========================================================================
   CONFETTI — coloured paper pieces around the final screen
   Two bursts from the bottom corners, then a shower from the top.
   ========================================================================= */
const Confetti = (() => {
  const COLORS = ["#1C5966","#5FA8B5","#F4B942","#E85D75","#7BC67B","#8E6CEF","#FF8A3D"];
  let cv, cx, parts = [], raf = 0, spawnUntil = 0, w = 0, h = 0, last = 0;

  function size(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function piece(x, y, vx, vy){
    return {x, y, vx, vy,
      w: 6 + Math.random()*7, h: 9 + Math.random()*9,
      rot: Math.random()*6.28, vr: (Math.random()-.5)*.35,
      wob: Math.random()*6.28, vw: .04 + Math.random()*.08,
      c: COLORS[(Math.random()*COLORS.length)|0],
      round: Math.random() < .2};
  }
  function burst(fromLeft){
    for (let i = 0; i < 70; i++){
      /* fire up and toward the middle of the page */
      const dir = fromLeft ? 1 : -1;
      const sp = 11 + Math.random()*10, up = -(.55 + Math.random()*.8);
      parts.push(piece(fromLeft ? -10 : w+10, h*.85,
                       dir * sp * (.35 + Math.random()*.65), sp * up));
    }
  }
  function frame(t){
    const dt = Math.min((t - last) / 16.7 || 1, 3); last = t;
    cx.clearRect(0, 0, w, h);
    if (t < spawnUntil){
      if (Math.random() < .6)
        parts.push(piece(Math.random()*w, -20, (Math.random()-.5)*2, 1.5 + Math.random()*2.5));
    }
    parts = parts.filter(p => p.y < h + 30);
    for (const p of parts){
      p.vy += .22 * dt; p.vx *= Math.pow(.992, dt); if (p.vy > 6) p.vy = 6;
      p.x += p.vx * dt + Math.sin(p.wob) * .8; p.y += p.vy * dt;
      p.rot += p.vr * dt; p.wob += p.vw * dt;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.scale(1, Math.cos(p.wob));                /* paper flutter */
      cx.fillStyle = p.c;
      if (p.round){ cx.beginPath(); cx.arc(0, 0, p.w/2, 0, 6.28); cx.fill(); }
      else cx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      cx.restore();
    }
    if (parts.length || t < spawnUntil) raf = requestAnimationFrame(frame);
    else { raf = 0; cx.clearRect(0, 0, w, h); }
  }
  return {
    start(){
      if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
      cv = cv || $("#confetti"); cx = cx || cv.getContext("2d");
      this.stop(); size();
      burst(true); burst(false);
      spawnUntil = performance.now() + 4000; last = performance.now();
      raf = requestAnimationFrame(frame);
    },
    stop(){
      if (raf) cancelAnimationFrame(raf);
      raf = 0; parts = [];
      if (cx) cx.clearRect(0, 0, w, h);
    }
  };
})();
addEventListener("resize", () => { if (S.steps[S.i]?.type === "done") Confetti.start(); });

/* =========================================================================
   NAVIGATION
   ========================================================================= */
function go(dir){
  const st = S.steps[S.i];

  /* the package list moves on only through its own buttons */
  if (dir > 0 && st.type === "packages") return;
  /* the Enterprise page can send people to a contact link instead */
  if (dir > 0 && st.type === "package") return;
  /* after the purchase there is no way back to the shop */
  if (dir < 0 && st.type === "welcome") return;

  /* moving forward off a required question: check it is answered */
  if (dir > 0 && st.type === "q"){
    const q = Q_BY_ID[st.qid], a = S.answers[q.id] || {};
    const empty = !(a.choices?.length) && !a.value;
    if (q.req && empty){ toast(t("required")); return; }

    /* a number or date that is out of range stops the visitor here */
    const msg = valueError(q, a.value);
    if (msg){ showValueError(q, a.value); toast(msg); return; }

    /* an "Other" choice with nothing typed in it stops them too */
    const blank = (a.choices || []).find(cid => hasFreeText(cid) && !(a.free?.[cid] || "").trim());
    if (blank){
      toast(t("badOther"));
      document.querySelector(`.freetext[data-free="${blank}"]`)?.focus();
      return;
    }
  }
  if (dir > 0 && st.type === "intake"){
    const c = readIntake();
    if (!c) return;
    S.customer = c;
    const follow = chooseFollowUp(c);
    S.route = follow ? ["Qs1", follow] : ["Qs1"];
    buildSteps();
    S.steps.unshift(...HEAD());
    S.i = INTAKE_AT;
    save();
  }

  let k = S.i + dir;
  while (k > 0 && k < S.steps.length && !stepVisible(S.steps[k])) k += dir;
  if (k < 0 || k >= S.steps.length) return;

  /* arriving at the final screen means the questionnaire is submitted */
  if (S.steps[k].type === "done" && S.steps[S.i].type !== "done") submit();

  S.i = k;
  if (S.steps[k].type !== "done") save();   /* a finished questionnaire is never "resumed" */
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

$("#btn-next").onclick = () => go(1);
$("#btn-prev").onclick = () => go(-1);

/* keyboard: left / right arrows move between questions */
document.addEventListener("keydown", e => {
  if (["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  const rtl = document.documentElement.dir === "rtl";
  if (e.key === "ArrowRight") go(rtl ? -1 : 1);
  if (e.key === "ArrowLeft")  go(rtl ?  1 : -1);
  if (e.key.toLowerCase() === "a" && e.ctrlKey && e.shiftKey) openAdmin();
});

/* =========================================================================
   LANGUAGE, DARK MODE, TOAST
   ========================================================================= */
function applyLang(){
  const ar = S.lang === "ar";
  document.documentElement.lang = ar ? "ar" : "en";
  document.documentElement.dir  = ar ? "rtl" : "ltr";
  $("#btn-lang").title = ar ? "English" : "العربية";
  $("#btn-save").textContent = t("save");
  $("#btn-exit").title = t("exit");
  $("#btn-exit").setAttribute("aria-label", t("exit"));
  localStorage.setItem("mulhim.lang", S.lang);
}
function applyTheme(){
  document.documentElement.dataset.theme = S.theme;
  $("#ico-moon").classList.toggle("hidden", S.theme === "dark");
  $("#ico-sun").classList.toggle("hidden", S.theme !== "dark");
  localStorage.setItem("mulhim.theme", S.theme);
}
$("#btn-lang").onclick  = () => { S.lang  = S.lang  === "ar" ? "en" : "ar"; applyLang();  render(); };
$("#btn-theme").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; applyTheme(); };
/* Save: keeps the answers so far on this device. */
$("#btn-save").onclick = () => { S.userSaved = true; save(); toast(t("saved")); };

/* Exit: leaves the questionnaire and goes back to the main page. Answers are
   kept only if the visitor pressed Save. */
$("#btn-exit").onclick = () => {
  if (!confirm(t("exitConfirm"))) return;
  if (!S.userSaved){ try{ localStorage.removeItem("mulhim.progress"); }catch(e){} }
  S.customer = {}; S.route = []; S.answers = {}; S.userSaved = false;
  S.pkg = null; S.steps = HEAD(); S.i = 0;
  render();
  window.scrollTo({top:0, behavior:"instant"});
};

let toastTimer;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2600);
}

/* =========================================================================
   SAVING PROGRESS (so a visitor can close the tab and come back)
   ========================================================================= */
function save(){
  try{
    localStorage.setItem("mulhim.progress", JSON.stringify({
      v:2, pkg:S.pkg, customer:S.customer, route:S.route, i:S.i, answers:S.answers
    }));
  }catch(e){ /* private browsing can block storage - not fatal */ }
}
function restore(){
  try{
    const raw = localStorage.getItem("mulhim.progress");
    if (!raw) return false;
    const p = JSON.parse(raw);
    if (!p.route || !p.route.length) return false;
    S.customer = p.customer || {};
    S.route    = p.route;
    S.answers  = p.answers || {};
    buildSteps();
    S.steps.unshift(...HEAD());
    S.pkg = p.pkg || null;
    /* progress saved by an older version had only 2 opening screens */
    S.i = Math.min((p.i || 1) + (p.v ? 0 : INTAKE_AT - 1), S.steps.length - 1);
    /* progress saved on the final screen (older versions did this) starts fresh */
    if (S.steps[S.i].type === "done"){
      localStorage.removeItem("mulhim.progress");
      S.customer = {}; S.route = []; S.answers = {};
      return false;
    }
    return true;
  }catch(e){ return false; }
}

/* =========================================================================
   TURNING THE ANSWERS INTO ROWS FOR THE FOUR EXCEL SHEETS
   ========================================================================= */
function nextId(key, prefix, width, start){
  const n = parseInt(localStorage.getItem("mulhim.seq."+key) || start, 10);
  localStorage.setItem("mulhim.seq."+key, n + 1);
  return prefix + String(n).padStart(width, "0");
}

function buildRows(){
  const now = new Date();
  const stamp = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" +
                String(now.getDate()).padStart(2,"0") + " " +
                String(now.getHours()).padStart(2,"0") + ":" +
                String(now.getMinutes()).padStart(2,"0");
  const c = S.customer;
  const customerId = nextId("customer","C",3,2);       /* C002, C003, ... */

  const out = {
    Customer: [[customerId, c.name, c.email, c.phone, c.birth, c.gender,
                c.ethnicity, c.country, c.nid, c.athlete]],
    Responses: [],
    ResponseAnswers: [],
    ResponseAnswerChoices: []
  };

  S.route.forEach(qsId => {
    const responseId = nextId("response","R",4,2);     /* R0002, R0003, ... */
    out.Responses.push([responseId, customerId, qsId,
                        S.lang.toUpperCase(), stamp, "Complete"]);

    (SECTIONS_BY_QS[qsId] || []).forEach(sec => {
      (QUESTIONS_BY_SEC[sec.id] || []).forEach(q => {
        const a = S.answers[q.id];
        if (!a || !visible({type:"q", qid:q.id})) return;
        const hasChoices = a.choices && a.choices.length;
        if (!hasChoices && !a.value) return;            /* left blank - skip */

        const at  = DB.answerTypes[q.at];
        const raId = nextId("ranswer","RA",4,3);         /* RA0003, ... */
        out.ResponseAnswers.push([
          raId, responseId, q.id,
          at.input === "text"   ? a.value : "",          /* Answer Text   */
          at.input === "number" ? a.value : "",          /* Answer Number */
          at.input === "date"   ? a.value : "",          /* Answer Date   */
          ""                                             /* Free Text     */
        ]);
        (a.choices || []).forEach(cid => {
          out.ResponseAnswerChoices.push([
            nextId("rachoice","RAC",4,3),                /* RAC0003, ... */
            raId, cid, (a.free && a.free[cid]) || ""
          ]);
        });
      });
    });
  });
  return out;
}

const SHEET_HEADERS = {
  Customer: ["Customer ID","Name","Email","Phone","Birth Date","Gender","Ethnicity",
             "Country","National ID / Passport No.",
             "Are you a professional or competitive athlete?"],
  Responses: ["Responses ID","Customer ID","Questionnaire ID","Language",
              "SubmittedAt","Status"],
  ResponseAnswers: ["ResponseAnswer ID","Responses ID","Question ID","Answer Text",
                    "Answer Number","Answer Date","Free Text"],
  ResponseAnswerChoices: ["ResponseAnswerChoice ID","ResponseAnswer ID",
                          "Question_Choice ID","Free Text Value"]
};

/* =========================================================================
   SUBMITTING
   ========================================================================= */
function submit(){
  const rows = buildRows();

  /* always keep a copy on this device */
  const store = JSON.parse(localStorage.getItem("mulhim.submissions") || "[]");
  store.push(rows);
  try{ localStorage.setItem("mulhim.submissions", JSON.stringify(store)); }catch(e){}
  localStorage.removeItem("mulhim.progress");

  if (CONFIG.SUBMIT_MODE === "url" && CONFIG.SUBMIT_URL){
    fetch(CONFIG.SUBMIT_URL, {
      method:"POST",
      /* text/plain avoids the browser asking the server for permission first,
         which Google Apps Script does not answer */
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(rows)
    }).then(() => toast(t("sent")))
      .catch(() => toast(t("sendfail")));
  } else {
    toast(t("saved"));
  }
}

/* =========================================================================
   ADMIN PANEL — download the rows as CSV
   ========================================================================= */
function csv(rows){
  const esc = v => {
    const s = (v ?? "").toString();
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  return rows.map(r => r.map(esc).join(",")).join("\r\n");
}
function download(name, text){
  /* the \uFEFF at the front tells Excel the file is UTF-8, so Arabic shows
     correctly instead of as question marks */
  const blob = new Blob(["\uFEFF" + text], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function allSubmissions(){
  return JSON.parse(localStorage.getItem("mulhim.submissions") || "[]");
}
function openAdmin(){
  const subs = allSubmissions();
  const count = k => subs.reduce((n,s) => n + (s[k]?.length || 0), 0);
  $("#admin-stats").innerHTML = `
    <table class="mini">
      <tr><th>Sheet</th><th>Rows waiting</th></tr>
      ${Object.keys(SHEET_HEADERS).map(k =>
        `<tr><td>${k}</td><td>${count(k)}</td></tr>`).join("")}
    </table>
    <p style="color:var(--muted);font-size:.85rem;margin-top:.75rem">
      ${subs.length} submission(s) stored on this device.
      Paste each file under the last row of the matching sheet —
      do not paste the header row again.</p>`;
  $("#admin").classList.add("on");
}
$("#dl-ent").onclick = () => {
  const leads = JSON.parse(localStorage.getItem("mulhim.enterprise") || "[]");
  if (!leads.length){ alert("No enterprise leads waiting."); return; }
  const H = ["submittedAt","language","name","position","email","phone","organization","organizationType","members"];
  download("EnterpriseLeads.csv", csv([H, ...leads.map(l => H.map(k => l[k]))]));
};
$("#admin-close").onclick = () => $("#admin").classList.remove("on");
$("#admin-clear").onclick = () => {
  if (!confirm("Delete every stored response on this device? This cannot be undone.")) return;
  localStorage.removeItem("mulhim.submissions");
  openAdmin();
};
document.querySelectorAll("[data-dl]").forEach(btn => {
  btn.onclick = () => {
    const sheet = btn.dataset.dl;
    const rows = allSubmissions().flatMap(s => s[sheet] || []);
    if (!rows.length){ alert("No rows waiting for " + sheet + "."); return; }
    download(sheet + ".csv", csv([SHEET_HEADERS[sheet], ...rows]));
  };
});

/* =========================================================================
   START THE PAGE
   ========================================================================= */
/* The background logo is drawn entirely by the stylesheet (see #watermark
   there). All that is left to do here is honour the CONFIG switch. */
document.getElementById("watermark").classList.toggle("hidden",
                                                      !CONFIG.SHOW_BACKGROUND_LOGO);

/* Copy the CONFIG colours into the stylesheet.
   IMPORTANT: these are written to the "-cfg" custom properties, never to
   --brand / --page / etc. directly. An inline style (which is what this is -
   it's set on the <html> element itself) always wins over a stylesheet rule
   for that same element, no matter how specific the rule is. If we wrote
   straight to --page here, it would permanently block the
   html[data-theme="dark"]{ --page:... } rule in the stylesheet below, and
   dark mode would never be able to change the background. Going through
   "-cfg" leaves --page free for dark mode to override normally. */
const R = document.documentElement.style;
R.setProperty("--brand-cfg",      CONFIG.COLOR_BRAND);
R.setProperty("--brand-deep-cfg", CONFIG.COLOR_BRAND_DEEP);
R.setProperty("--muted-cfg",      CONFIG.COLOR_MUTED);
R.setProperty("--line-cfg",       CONFIG.COLOR_LINE);
R.setProperty("--page-cfg",       CONFIG.COLOR_PAGE);

applyLang();
applyTheme();

if (!restore()){
  S.steps = HEAD();
  S.i = 0;
  /* a link such as  questionnaire.html?package=athletes  opens that package's page */
  const want = new URLSearchParams(location.search).get("package");
  if (want && PKG_BY_ID[want]){ S.pkg = want; S.i = 1; }
  /* returning from the payment page:  ?paid=athletes  */
  const paid = new URLSearchParams(location.search).get("paid");
  if (paid && PKG_BY_ID[paid] && !PKG_BY_ID[paid].enterprise){ S.pkg = paid; S.i = 2; }
}
render();

if (new URLSearchParams(location.search).get("admin") === "1") openAdmin();
</script>
